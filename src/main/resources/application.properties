spring.application.name=RabbitFeeding

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rabbit_feeding?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:default_user}
spring.datasource.password=${DB_PASSWORD:default_password}

openmeteo.weather.url=https://api.open-meteo.com/v1/forecast
openmeteo.geocoding.url=https://nominatim.openstreetmap.org/search

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true